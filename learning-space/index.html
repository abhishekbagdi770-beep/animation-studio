<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX — Learning Space</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

header {
  height: 42px;
  flex-shrink: 0;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 13px;
}

.logo {
  color: #ff1493;
  margin-right: 5px;
}

.title {
  font-weight: bold;
}

.status {
  margin-left: auto;
  color: #777;
  font-size: 9px;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px 100px;
}

.message {
  margin-bottom: 18px;
  font-size: 13px;
  line-height: 1.5;
}

.composer {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 10px;
  height: 42px;
  background: #202124;
  border-radius: 22px;
  display: flex;
  align-items: center;
  padding: 0 5px 0 14px;
}

#plus {
  width: 28px;
  height: 32px;
  border: 0;
  background: transparent;
  color: white;
  font-size: 22px;
  flex-shrink: 0;
}

#input {
  flex: 1;
  min-width: 0;
  height: 38px;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  font-size: 15px;
  padding: 0 8px;
}

#input::placeholder {
  color: #888;
}

#send {
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  background: #ff1493;
  color: white;
  font-size: 16px;
  flex-shrink: 0;
}
</style>
</head>

<body>

<header>
  <span class="logo">●</span>
  <span class="title">MAX — Learning Space</span>
  <span class="status">Watching</span>
</header>

<main id="messages">
  <div class="message">Hi! 👋🙂</div>
  <div class="message">What are we working on today?</div>
</main>

<div class="composer">
  <button id="plus" type="button">+</button>

  <input
    id="input"
    type="text"
    placeholder="Message Max..."
    autocomplete="off"
  >

  <button id="send" type="button" aria-label="Send">↑</button>
</div>

<script src="./app.js"></script>
</body>
</html>
